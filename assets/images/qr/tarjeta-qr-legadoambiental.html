<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Open+Sans:wght@400;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 640px;
    height: 880px;
    background: #f8fafc;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Montserrat', sans-serif;
  }
  .card {
    width: 540px;
    background: #ffffff;
    border-radius: 28px;
    box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.12);
    border: 1px solid #e2e8f0;
    padding: 36px 36px 32px 36px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .logo {
    width: 140px;
    height: auto;
    margin-bottom: 20px;
    display: block;
  }
  .qr-box {
    background: #ffffff;
    padding: 16px;
    border-radius: 22px;
    border: 2.5px solid #1e6040;
    box-shadow: 0 12px 28px -6px rgba(30, 96, 64, 0.16);
    margin-bottom: 22px;
    display: inline-block;
  }
  .qr-img {
    width: 270px;
    height: 270px;
    display: block;
  }
  .title {
    font-size: 20px;
    font-weight: 800;
    color: #0f172a;
    margin-bottom: 10px;
    letter-spacing: -0.3px;
  }
  .url-badge {
    display: inline-block;
    background: #ecfdf5;
    color: #1e6040;
    border: 1px solid #a7f3d0;
    font-weight: 700;
    font-size: 15px;
    padding: 6px 20px;
    border-radius: 30px;
    margin-bottom: 12px;
    letter-spacing: 0.2px;
  }
  .subtitle {
    font-family: 'Open Sans', sans-serif;
    font-size: 11.5px;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    font-weight: 600;
  }
</style>
